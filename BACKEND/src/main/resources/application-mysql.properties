# Se activa con el perfil "mysql" y reemplaza a la base H2.
# La contraseña NO se escribe aquí: se lee de la variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/zentradb?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# La consola web solo sirve para H2
spring.h2.console.enabled=false
