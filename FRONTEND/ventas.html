<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTRA - Ventas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>ZENTRA</h1>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="ventas.html">Ventas</a></li>
            <li><a href="reportes.html">Reportes</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Registrar venta</h2>
        <form action="#" method="post">
            <p><label for="producto">Producto:</label>
            <input type="text" id="producto" name="producto" required></p>
            <p><label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required></p>
            <p><label for="precio">Precio unitario:</label>
            <input type="number" id="precio" name="precio" min="0" required></p>
            <p><label for="total">Total:</label>
            <input type="number" id="total" name="total" min="0" readonly></p>
            <button type="submit">Registrar venta</button>
        </form>
    </section>

    <section>
        <h2>Ventas recientes</h2>
        <table border="1">
            <thead>
                <tr><th>Producto</th><th>Cantidad</th><th>Total</th></tr>
            </thead>
            <tbody>
                <tr><td>Producto ejemplo</td><td>2</td><td>$20.000</td></tr>
            </tbody>
        </table>
    </section>
</main>

<footer><p>ZENTRA - Estanco Dejavu</p></footer>
<script src="ventas.js"></script>
</body>
</html>
