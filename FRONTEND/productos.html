<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTRA - Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>ZENTRA</h1>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="ventas.html">Ventas</a></li>
            <li><a href="reportes.html">Reportes</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Gestión de productos</h2>
        <p>Registrar, consultar, actualizar y eliminar productos.</p>
    </section>

    <section>
        <h2 id="titulo-formulario">Registrar producto</h2>
        <form id="form-producto">
            <p><label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required></p>
            <p><label for="categoria">Categoría:</label>
            <input type="text" id="categoria" name="categoria" required></p>
            <p><label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" min="1" step="any" required></p>
            <p><label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" min="0" step="1" required></p>
            <p><label for="stockMinimo">Stock mínimo:</label>
            <input type="number" id="stockMinimo" name="stockMinimo" min="0" step="1" required></p>
            <button type="submit" id="boton-guardar">Registrar producto</button>
            <button type="button" id="boton-cancelar" hidden>Cancelar</button>
        </form>
        <p id="mensaje" role="status"></p>
    </section>

    <section>
        <h2>Productos registrados</h2>
        <table border="1">
            <thead>
                <tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Stock mínimo</th><th>Acciones</th></tr>
            </thead>
            <tbody id="lista-productos"></tbody>
        </table>
    </section>
</main>

<footer><p>ZENTRA - Estanco Dejavu</p></footer>
<script src="productos.js"></script>
</body>
</html>
